name: Deploy Jaspr to Firebase Hosting on Merge
on:
  push:
    branches:
      - main
      - uat
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Install Jaspr CLI
        run: |
          flutter pub global activate jaspr_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Build Jaspr Web
        working-directory: packages/tranyx_web
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            jaspr build --dart-define=ENV=prod
          elif [[ "${{ github.ref_name }}" == "uat" ]]; then
            jaspr build --dart-define=ENV=uat
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            jaspr build --dart-define=ENV=dev
          fi

      - name: Deploy to Firebase Hosting (prod)
        if: github.ref_name == 'main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_APP }}
          channelId: live
          projectId: tranyx-app

      - name: Deploy Firestore Rules (prod)
        if: github.ref_name == 'main'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_APP }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          npx firebase-tools deploy --only firestore:rules --project tranyx-app
          rm service-account.json

      - name: Deploy to Firebase Hosting (uat)
        if: github.ref_name == 'uat'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_UAT }}
          projectId: tranyx-uat
          channelId: live

      - name: Deploy Firestore Rules (uat)
        if: github.ref_name == 'uat'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_UAT }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          npx firebase-tools deploy --only firestore:rules --project tranyx-uat
          rm service-account.json

      - name: Deploy to Firebase Hosting (dev)
        if: github.ref_name == 'develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_DEV }}
          projectId: tranyx-dev
          channelId: live

      - name: Deploy Firestore Rules (dev)
        if: github.ref_name == 'develop'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_DEV }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          npx firebase-tools deploy --only firestore:rules --project tranyx-dev
          rm service-account.json