name: Deploy Jaspr to Firebase Hosting on Merge
on:
  push:
    branches:
      - main
      - uat
      - develop
    paths:
      - 'packages/tranyx_web/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@v3 # v3.0.2
        with:
          filters: |
            code:
              - 'packages/tranyx_web/**'

      - name: Setup Flutter
        if: steps.filter.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        if: steps.filter.outputs.code == 'true'
        run: flutter pub get

      - name: Install Jaspr CLI
        if: steps.filter.outputs.code == 'true'
        run: |
          flutter pub global activate jaspr_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Generate Env Config
        if: steps.filter.outputs.code == 'true'
        run: dart run shared:generate_env
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}

      - name: Build Jaspr Web
        if: steps.filter.outputs.code == 'true'
        working-directory: packages/tranyx_web
        env:
          REF_NAME: ${{ github.ref_name }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          jaspr clean
          if [[ "$REF_NAME" == "main" ]]; then
            jaspr build --dart-define=ENV=prod --dart-define=XENDIT_SECRET_KEY="$XENDIT_SECRET_KEY" --dart-define=IMGBB_API_KEY="$IMGBB_API_KEY"
          elif [[ "$REF_NAME" == "uat" ]]; then
            jaspr build --dart-define=ENV=uat --dart-define=XENDIT_SECRET_KEY="$XENDIT_SECRET_KEY" --dart-define=IMGBB_API_KEY="$IMGBB_API_KEY"
          elif [[ "$REF_NAME" == "develop" ]]; then
            jaspr build --dart-define=ENV=dev --dart-define=XENDIT_SECRET_KEY="$XENDIT_SECRET_KEY" --dart-define=IMGBB_API_KEY="$IMGBB_API_KEY"
          fi

      - name: Deploy to Firebase Hosting (prod)
        if: steps.filter.outputs.code == 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0  # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_APP }}
          channelId: live
          projectId: tranyx-app

      - name: Deploy to Firebase Hosting (uat)
        if: steps.filter.outputs.code == 'true' && github.ref_name == 'uat'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0  # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_UAT }}
          projectId: tranyx-uat
          channelId: live

      - name: Deploy to Firebase Hosting (dev)
        if: steps.filter.outputs.code == 'true' && github.ref_name == 'develop'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0  # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_DEV }}
          projectId: tranyx-dev
          channelId: live