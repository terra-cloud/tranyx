name: Deploy Jaspr to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Install Jaspr CLI
        run: |
          flutter pub global activate jaspr_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Build Jaspr Web
        working-directory: packages/tranyx_web
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            jaspr build --dart-define=ENV=prod
          elif [[ "${{ github.base_ref }}" == "uat" ]]; then
            jaspr build --dart-define=ENV=uat
          elif [[ "${{ github.base_ref }}" == "develop" ]]; then
            jaspr build --dart-define=ENV=dev
          fi

      - name: Deploy PR Preview to Firebase Hosting (prod project)
        if: github.base_ref == 'main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_APP }}
          projectId: tranyx-app
          entryPoint: packages/tranyx_web

      - name: Deploy PR Preview to Firebase Hosting (uat project)
        if: github.base_ref == 'uat'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_UAT }}
          projectId: tranyx-uat
          entryPoint: packages/tranyx_web

      - name: Deploy PR Preview to Firebase Hosting (dev project)
        if: github.base_ref == 'develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_DEV }}
          projectId: tranyx-dev
          entryPoint: packages/tranyx_web