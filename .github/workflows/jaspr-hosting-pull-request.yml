name: Deploy Jaspr to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - 'packages/tranyx_web/**'
      - 'packages/shared/**'
      - '.github/workflows/jaspr-hosting-pull-request.yml'
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            code:
              - 'packages/tranyx_web/**'
              - 'packages/shared/**'
              - '.github/workflows/jaspr-hosting-pull-request.yml'

      - name: Setup Flutter
        if: steps.filter.outputs.code == 'true'
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        if: steps.filter.outputs.code == 'true'
        run: flutter pub get

      - name: Install Jaspr CLI
        if: steps.filter.outputs.code == 'true'
        run: |
          flutter pub global activate jaspr_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Generate Env Config
        if: steps.filter.outputs.code == 'true'
        run: dart run shared:generate_env
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GEMINI_AI_API_KEY: ${{ secrets.GEMINI_AI_API_KEY }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_PUBLIC_KEY: ${{ secrets.SOLANA_PUBLIC_KEY }}
          TREASURY_PRIVATE_KEY: ${{ secrets.TREASURY_PRIVATE_KEY }}
          TREASURY_PUBLIC_KEY: ${{ secrets.TREASURY_PUBLIC_KEY }}
          BASEMAPS_API_KEY: ${{ secrets.BASEMAPS_API_KEY }}

      - name: Build Jaspr Web
        if: steps.filter.outputs.code == 'true'
        working-directory: packages/tranyx_web
        env:
          BASE_REF: ${{ github.base_ref }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          BASEMAPS_API_KEY: ${{ secrets.BASEMAPS_API_KEY }}
          GEMINI_AI_API_KEY: ${{ secrets.GEMINI_AI_API_KEY }}
          SOLANA_PUBLIC_KEY: ${{ secrets.SOLANA_PUBLIC_KEY }}
        run: |
          jaspr clean
          if [[ "$BASE_REF" == "main" ]]; then
            jaspr build --dart-define=ENV=prod --dart-define=XENDIT_SECRET_KEY="$XENDIT_SECRET_KEY" --dart-define=IMGBB_API_KEY="$IMGBB_API_KEY" --dart-define=BASEMAPS_API_KEY="$BASEMAPS_API_KEY" --dart-define=GEMINI_AI_API_KEY="$GEMINI_AI_API_KEY" --dart-define=SOLANA_PUBLIC_KEY="$SOLANA_PUBLIC_KEY"
          elif [[ "$BASE_REF" == "uat" ]]; then
            jaspr build --dart-define=ENV=uat --dart-define=XENDIT_SECRET_KEY="$XENDIT_SECRET_KEY" --dart-define=IMGBB_API_KEY="$IMGBB_API_KEY" --dart-define=BASEMAPS_API_KEY="$BASEMAPS_API_KEY" --dart-define=GEMINI_AI_API_KEY="$GEMINI_AI_API_KEY" --dart-define=SOLANA_PUBLIC_KEY="$SOLANA_PUBLIC_KEY"
          else
            jaspr build --dart-define=ENV=dev --dart-define=XENDIT_SECRET_KEY="$XENDIT_SECRET_KEY" --dart-define=IMGBB_API_KEY="$IMGBB_API_KEY" --dart-define=BASEMAPS_API_KEY="$BASEMAPS_API_KEY" --dart-define=GEMINI_AI_API_KEY="$GEMINI_AI_API_KEY" --dart-define=SOLANA_PUBLIC_KEY="$SOLANA_PUBLIC_KEY"
          fi

      - name: Set Environment Variables
        if: steps.filter.outputs.code == 'true'
        id: set_env
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" == "main" ]]; then
            echo "project_id=tranyx-app" >> $GITHUB_OUTPUT
            echo "sa_key_name=FIREBASE_SERVICE_ACCOUNT_TRANYX_APP" >> $GITHUB_OUTPUT
          elif [[ "$BASE_REF" == "uat" ]]; then
            echo "project_id=tranyx-uat" >> $GITHUB_OUTPUT
            echo "sa_key_name=FIREBASE_SERVICE_ACCOUNT_TRANYX_UAT" >> $GITHUB_OUTPUT
          else
            echo "project_id=tranyx-dev" >> $GITHUB_OUTPUT
            echo "sa_key_name=FIREBASE_SERVICE_ACCOUNT_TRANYX_DEV" >> $GITHUB_OUTPUT
          fi

      # Deploy to prod project (PR preview — no channelId = auto preview channel)
      - name: Deploy PR Preview (prod)
        if: steps.filter.outputs.code == 'true' && github.base_ref == 'main'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0.2.3
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_APP }}
          projectId: tranyx-app

      - name: Deploy PR Preview (uat)
        if: steps.filter.outputs.code == 'true' && github.base_ref == 'uat'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0.2.3
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_UAT }}
          projectId: tranyx-uat

      - name: Deploy PR Preview (dev)
        if: steps.filter.outputs.code == 'true' && github.base_ref != 'main' && github.base_ref != 'uat'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0.2.3
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_DEV }}
          projectId: tranyx-dev