name: headless_nav_jaspr
description: Jaspr web package for headless_nav with MapLibre GL JS interop, browser geolocation, Web Speech API, and Riverpod state management.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  headless_nav_core: any
  jaspr: ^0.23.1
  jaspr_riverpod: ^0.4.0
  web: ^1.1.0

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
