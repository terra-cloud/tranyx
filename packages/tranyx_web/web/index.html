<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebase.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://unpkg.com https://*.googleusercontent.com; connect-src 'self' https://*.project-osrm.org https://*.googleapis.com https://*.firebaseio.com wss://*.googleapis.com wss://*.firebaseio.com; font-src 'self' https://fonts.gstatic.com;">
  <title>Welcome to Tranyx</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <!-- External Scripts & Styles from main.server.dart -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="styles.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    html,
    body {
      width: 100%;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      /* zinc-950 */
      color: #fafafa;
      /* zinc-50 */
    }
  </style>

  <script>
    // Monkey-patch removeChild to gracefully handle elements replaced/detached by external libraries like Lucide.js
    (function() {
      const originalRemove = Node.prototype.removeChild;
      Node.prototype.removeChild = function(child) {
        if (child && child.parentNode !== this) {
          // If child was replaced by Lucide, find the injected SVG inside this parent and remove it instead
          if (child.hasAttribute && child.hasAttribute('data-lucide')) {
            const svg = this.querySelector('svg.lucide, svg');
            if (svg) {
              return originalRemove.call(this, svg);
            }
          }
          // If the child belongs to a different parent, remove it from there
          if (child.parentNode) {
            try {
              return originalRemove.call(child.parentNode, child);
            } catch (e) {}
          }
          // If already detached, return gracefully to prevent NotFoundError
          return child;
        }
        try {
          return originalRemove.call(this, child);
        } catch (e) {
          return child;
        }
      };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const observer = new MutationObserver(() => {
        observer.disconnect();
        lucide.createIcons();
        observer.observe(document.body, { childList: true, subtree: true });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });

    window.signInWithGoogle = async function (config) {
      if (!firebase.apps.length) {
        firebase.initializeApp(config);
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        const idToken = await result.user.getIdToken();
        return JSON.stringify({
          uid: result.user.uid,
          idToken: idToken,
          refreshToken: result.user.refreshToken,
          email: result.user.email,
          displayName: result.user.displayName,
          photoUrl: result.user.photoURL
        });
      } catch (error) {
        console.error(error);
        throw error;
      }
    };

    window.listenToNotifications = function (uid, callback) {
      if (!firebase.apps.length) return () => { };
      const db = firebase.firestore();
      return db.collection('notifications')
        .where('uid', '==', uid)
        .where('isRead', '==', false)
        .onSnapshot((snapshot) => {
          const notifs = [];
          snapshot.forEach(doc => notifs.push({ id: doc.id, ...doc.data() }));
          callback(JSON.stringify(notifs));
        });
    };

    window.markNotificationRead = function (notifId) {
      if (!firebase.apps.length) return;
      firebase.firestore().collection('notifications').doc(notifId).update({ isRead: true });
    };

    window.listenToJobs = function (uid, callback) {
      if (!firebase.apps.length) return () => { };
      const db = firebase.firestore();
      
      const unsub1 = db.collection('jobs')
        .where('employerId', '==', uid)
        .onSnapshot((snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          callback(JSON.stringify({ type: 'employer', jobs: list }));
        }, (error) => {
          console.error("Employer jobs listener error:", error);
        });

      const unsub2 = db.collection('jobs')
        .where('acceptedApplicantId', '==', uid)
        .onSnapshot((snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          callback(JSON.stringify({ type: 'nyxian', jobs: list }));
        }, (error) => {
          console.error("Nyxian jobs listener error:", error);
        });

      return () => {
        unsub1();
        unsub2();
      };
    };

    // ── OSRM route helper (CSP-safe — real script, not eval) ──────────
    window._osrmRoute = async function (elementId, fromLat, fromLng, toLat, toLng, color) {
      const map = window['__lmap_' + elementId];
      if (!map || !window.L) return;

      const routeKey = '__lroute_' + elementId;
      if (window[routeKey]) { window[routeKey].remove(); window[routeKey] = null; }

      let coords = [[fromLat, fromLng], [toLat, toLng]];
      try {
        const url = 'https://router.project-osrm.org/route/v1/driving/'
          + fromLng + ',' + fromLat + ';' + toLng + ',' + toLat
          + '?overview=full&geometries=geojson';
        const resp = await fetch(url);
        const data = await resp.json();
        coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      } catch (e) { /* straight-line fallback */ }

      const poly = L.polyline(coords, {
        color: color, weight: 6, opacity: 0.9,
        lineCap: 'round', lineJoin: 'round'
      }).addTo(map);
      window[routeKey] = poly;
      map.fitBounds(poly.getBounds(), { padding: [40, 40] });
    };
  </script>
</head>

<body>
  <!-- Jaspr will mount the app here automatically -->
  <script defer src="main.client.dart.js"></script>
</body>

</html>
